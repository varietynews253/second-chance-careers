version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: second-chance-careers-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: second_chance_careers
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
